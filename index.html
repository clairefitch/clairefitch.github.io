<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Claire Fitch — Composer, sound artist, cellist, lecturer</title>
<meta name="description" content="Sonic art, electronic literature, game scores, publications and production music — Claire Fitch FHEA." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="site.jsx"></script>

<script type="text/babel">
// Landing — full-bleed featured hero + editorial section cards.

function HomeHero() {
  return (
    <section className="home-hero" style={{ position: 'relative', minHeight: 620, overflow: 'hidden', background: SITE.dark, color: SITE.darkPaper, display: 'flex', flexDirection: 'column', justifyContent: 'flex-end' }}>
      <SiteNav mode="overlay" />
      <div className="home-hero-bg" style={{
        position: 'absolute', inset: 0,
        background: 'url(https://clairefitch.github.io/images/BI-1.jpg) center/cover',
        filter: 'brightness(0.6) contrast(1.05) saturate(0.92) sepia(0.18)',
      }} />
      <div className="home-hero-bg" style={{ position: 'absolute', inset: 0, background: 'linear-gradient(180deg, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0) 28%, rgba(0,0,0,0) 60%, rgba(14,10,5,0.72) 100%)' }} />
      <div className="h-padded home-hero-content" style={{ position: 'relative', zIndex: 1, padding: '0 56px 72px' }}>
        <div className="tape tape-light" style={{ marginBottom: 28 }}>Featured · Game Score · 2026</div>
        <h1 className="display hero-display" style={{ fontSize: 132, margin: 0, color: SITE.darkPaper }}>Claire&nbsp;Fitch</h1>
        <div className="hero-grid" style={{ display: 'grid', gridTemplateColumns: '2fr 1fr', gap: 56, marginTop: 36, alignItems: 'end' }}>
          <p style={{ margin: 0, fontSize: 22, lineHeight: 1.45, maxWidth: 720, color: 'rgba(246,240,223,0.92)', textWrap: 'pretty' }}>
            {BIO_SHORT}
          </p>
          <div className="now-playing" style={{ textAlign: 'right' }}>
            <div className="mono" style={{ color: SITE.darkMuted, marginBottom: 8 }}>Now playing</div>
            <div style={{ fontFamily: "'Lora', serif", fontSize: 24, fontStyle: 'italic' }}>JSON B(ourne)AS(soon)H</div>
            <div className="mono" style={{ color: SITE.darkMuted, marginTop: 4 }}>Game Score · 2026</div>
            <PlayBar />
          </div>
        </div>
      </div>
    </section>
  );

}

function PlayBar() {
  return (
    <div className="playbar" style={{ display: 'flex', alignItems: 'center', gap: 14, marginTop: 18, justifyContent: 'flex-end' }}>
      <a href="https://clairefitch.github.io/JSONBASH/jsonbash.html" aria-label="Play featured work" style={{
        width: 44, height: 44, borderRadius: '50%', border: `1px solid ${SITE.darkFaint}`,
        background: 'rgba(246,240,223,0.08)', color: SITE.darkPaper, display: 'flex',
        alignItems: 'center', justifyContent: 'center', textDecoration: 'none', flex: '0 0 auto',
      }}>
        <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><polygon points="2,1 13,7 2,13" /></svg>
      </a>
      <div className="playbar-track" style={{ flex: '0 0 240px', height: 2, background: 'rgba(246,240,223,0.25)', position: 'relative' }}>
        <div style={{ position: 'absolute', left: 0, top: 0, height: '100%', width: '38%', background: SITE.darkPaper }} />
      </div>
      <span className="mono" style={{ color: SITE.darkMuted, flex: '0 0 auto' }}>02:14 / 05:48</span>
    </div>
  );
}

function AboutBlock() {
  return (
    <section id="about-intro" style={{ padding: '96px 56px', borderBottom: `1px solid ${SITE.rule}` }}>
      <div className="about-grid" style={{ display: 'grid', gridTemplateColumns: '1fr 2fr', gap: 64, alignItems: 'start' }}>
        <div>
          <div className="mono" style={{ color: SITE.accent, marginBottom: 16 }}>About</div>
          <h2 className="display display-72" style={{ fontSize: 56, margin: 0 }}>
            A practice<br/>between cello<br/>and code.
          </h2>
        </div>
        <div style={{ fontSize: 20, lineHeight: 1.55 }}>
          <p style={{ margin: 0, textWrap: 'pretty' }}>{BIO_LONG[1]}</p>
          <p style={{ marginTop: 18, color: SITE.muted, textWrap: 'pretty' }}>{BIO_LONG[2]}</p>
          <div className="about-stats" style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 24, marginTop: 40, borderTop: `1px solid ${SITE.rule}`, paddingTop: 24 }}>
            <Stat label="PhD"      value="QUB · SARC, 2019" />
            <Stat label="Book"     value="Sounding Emerging Media, 2022" />
            <Stat label="Teaching" value="DkIT, since 2015" />
            <Stat label="RTÉ NSO"  value="Cello · 1995–2012" />
          </div>
        </div>
      </div>
    </section>
  );
}

function Stat({ label, value }) {
  return (
    <div>
      <div className="mono" style={{ color: SITE.faint, marginBottom: 6 }}>{label}</div>
      <div style={{ fontStyle: 'italic' }}>{value}</div>
    </div>
  );
}

function WorkCard({ tag, title, blurb, img, ratio, items, href }) {
  return (
    <div className="card works-card" style={{ padding: 0, display: 'grid', gridTemplateColumns: '1.1fr 1fr', overflow: 'hidden' }}>
      <a href={href} className="ph-img" style={{
        aspectRatio: ratio || '4/5', backgroundImage: `url(${img})`,
        display: 'block', minHeight: 320,
      }} />
      <div style={{ padding: '40px 40px 32px', display: 'flex', flexDirection: 'column' }}>
        <div className="mono" style={{ color: SITE.accent, marginBottom: 14 }}>{tag}</div>
        <h3 className="display display-56" style={{ fontSize: 42, margin: 0, marginBottom: 14 }}>
          <a href={href}>{title}</a>
        </h3>
        <p style={{ color: SITE.muted, margin: 0, fontSize: 17, textWrap: 'pretty' }}>{blurb}</p>
        <ul style={{ listStyle: 'none', padding: 0, margin: '24px 0 0', flex: 1 }}>
          {items.map((it, i) => (
            <li key={i} style={{ display: 'grid', gridTemplateColumns: '54px 1fr', gap: 12, padding: '10px 0', borderTop: `1px solid ${SITE.rule}`, alignItems: 'baseline' }}>
              <span className="mono" style={{ color: SITE.faint }}>{it.year}</span>
              <span>
                <a href={it.href} className="under">{it.title}</a>
                <div style={{ color: SITE.muted, fontSize: 14, fontStyle: 'italic', marginTop: 2 }}>{it.venue}</div>
              </span>
            </li>
          ))}
        </ul>
        <a href={href} className="mono" style={{ marginTop: 18, color: SITE.accent }}>Explore {title.toLowerCase()} →</a>
      </div>
    </div>
  );
}

function Works() {
  return (
    <section id="works" style={{ padding: '88px 56px', borderTop: `1px solid ${SITE.rule}` }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 40, flexWrap: 'wrap', gap: 12 }}>
        <h2 className="display display-72" style={{ fontSize: 72, margin: 0 }}>Selected works.</h2>
        <div className="mono" style={{ color: SITE.muted }}>Six domains · 1995–present</div>
      </div>

      <div style={{ display: 'flex', flexDirection: 'column', gap: 28 }}>
        <WorkCard
          tag="01 · Sonic Art" title="Sonic Art"
          href="sonic-art.html"
          blurb="Practice-based works exploring voice, text and field — commissioned and broadcast across Ireland and the UK."
          img="https://clairefitch.github.io/images/BI-1.jpg"
          items={[
            { year: '2021', title: 'Becoming Imperceptible', venue: 'thirtythree-45 · Droichead Arts', href: 'sonic-art.html#becoming-imperceptible' },
            { year: '2020', title: 'Murdering The Time',     venue: 'The Blue of The Night, RTÉ Lyric FM', href: 'sonic-art.html#murdering-the-time' },
            { year: '2020', title: 'Mrs Matchwell',           venue: 'Scribbledehobble, MoLI, Dublin', href: 'sonic-art.html#mrs-matchwell' },
            { year: '2015', title: 'Written in his Voice',    venue: 'Sonic Lab, QUB, Belfast', href: 'sonic-art.html#written-in-his-voice' },
          ]}
        />
        <WorkCard
          tag="02 · Electronic Literature" title="Electronic Literature"
          href="electronic-literature.html"
          blurb="Transmedia works combining sound, text and image. Presented at ELO Cork (2019), Florida (2020) and Bergen (2021)."
          img="https://clairefitch.github.io/images/WWNBS.jpg"
          items={[
            { year: '2014', title: 'Look (FFEBCD)',     venue: 'HearSay Festival, Ireland',         href: 'electronic-literature.html#look' },
            { year: '2020', title: 'We Called It Dirt', venue: 'with Michael J. Maguire',           href: 'electronic-literature.html#we-called-it-dirt' },
            { year: '2021', title: 'Ear For The Surge', venue: 'ELO Covid E-Lit Exhibition, Bergen', href: 'electronic-literature.html#ear-for-the-surge' },
            { year: '2020', title: 'SFBookDraft1',      venue: 'with Kelly McErlean · ELO Florida', href: 'electronic-literature.html#sfbookdraft1' },
          ]}
        />
        <WorkCard
          tag="03 · Game Scores" title="Game Scores"
          href="game-scores.html"
          blurb="Interactive scores treating gameplay as performance — page-turning, branching, mapping."
          img="https://clairefitch.github.io/images/ATBS.png"
         items={[
            { year: '2026', title: 'JSON B(ourne)AS(soon)H',         venue: 'Online Gamescore',                href: 'game-scores.html#jsonbash' },
            { year: '2019', title: 'And The Birds Sang',         venue: 'Music Current, Dublin',                href: 'game-scores.html#atbs' },
            { year: '2022', title: 'Tale Of A Great Sham(e)Text', venue: 'Sonorities Festival, Belfast',         href: 'game-scores.html#tgs' },
            { year: '2020', title: 'We Called It Dirt',          venue: 'gamescore version',                    href: 'game-scores.html#wcid' },
          ]}
        />
        <WorkCard
          tag="04 · Publications" title="Publications"
          href="publications.html"
          blurb="Across augmented reality, web and print: (RE)VERB #1 (2022), ELO COVID Exhibition (2021), and a Routledge monograph (2022)."
          img="https://clairefitch.github.io/images/SEM-CF.png"
          items={[
            { year: '2022', title: 'Sounding Emerging Media',           venue: 'Routledge — monograph',                  href: 'publications.html#sounding-emerging-media' },
            { year: '2022', title: 'Vanguard Voices',                   venue: '(RE)VERB #1 · with McErlean, Murray',    href: 'publications.html#vanguard-voices' },
            { year: '2021', title: 'Folding, Unfolding, Refolding Sound', venue: 'Digital Art in Ireland · Anthem Press', href: 'publications.html#folding-unfolding' },
            { year: '2020', title: 'Becoming Imperceptible',            venue: 'Where Are We Now? #1, thirtythree-45',   href: 'publications.html#becoming-imperceptible-pub' },
          ]}
        />
        <WorkCard
          tag="05 · Production Music & SFX" title="Production Music & SFX"
          href="production-music.html"
          blurb="Over twenty years of production music and sound effects for television, film, games and podcasts."
          img="https://clairefitch.github.io/images/CF.png"
          items={[
            { year: '2023', title: 'Another Day',           venue: 'Bandcamp · Album',                  href: 'production-music.html#another-day' },
            { year: '2009', title: 'Celocity',              venue: 'Magnatune · Album',                  href: 'production-music.html#celocity' },
            { year: '2005', title: 'Ambiencellist Part II', venue: 'Magnatune · Album',                  href: 'production-music.html#ambiencellist-2' },
            { year: '—',    title: 'Stock libraries',       venue: 'FilmPac · Pond5 · Deposit Photos',   href: 'production-music.html#stock' },
          ]}
        />
        <WorkCard
          tag="06 · Teaching & Research" title="Teaching & Research"
          href="teaching-research.html"
          blurb="Lecturer at Dundalk Institute of Technology since 2015. FHEA, Avid ACI Instructor for Sibelius, and PhD from Queen’s University Belfast’s Sonic Arts Research Centre."
          img="https://clairefitch.github.io/images/DkIT.jpg"
          items={[
            { year: '2019', title: 'PhD · Sonic Arts Research Centre',  venue: 'QUB · supervised by Prof. Michael Alcorn', href: 'teaching-research.html#phd' },
            { year: '2015', title: 'Lecturer · DkIT',                   venue: 'Creative Arts, Media and Music',          href: 'teaching-research.html#teaching' },
            { year: '—',    title: 'Avid ACI Instructor · Sibelius',    venue: 'Notation, engraving, score practice',     href: 'teaching-research.html#sibelius' },
            { year: '—',    title: 'Conferences & festivals',          venue: 'ELO · ISSTA · Sonorities · Music Current', href: 'teaching-research.html#conferences' },
          ]}
        />
      </div>
    </section>
  );
}

function ContactCTA() {
  return (
    <section style={{ padding: '96px 56px', borderTop: `1px solid ${SITE.rule}`, background: SITE.card }}>
      <div className="cta-grid" style={{ display: 'grid', gridTemplateColumns: '1.4fr 1fr', gap: 56, alignItems: 'end' }}>
        <div>
          <div className="mono" style={{ color: SITE.accent, marginBottom: 16 }}>Get in touch</div>
          <h2 className="display display-72" style={{ fontSize: 84, margin: 0, textWrap: 'balance' }}>
            Commission, collaborate, license.
          </h2>
          <p style={{ marginTop: 22, color: SITE.muted, fontSize: 19, maxWidth: 620, textWrap: 'pretty' }}>
            Bespoke composition, sound design, academic collaboration, Sibelius training, or licensing from the back catalogue — the contact form will get you a reply within a week.
          </p>
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 14, alignItems: 'flex-start' }}>
          <a href="contact.html" className="mono" style={{
            background: SITE.ink, color: SITE.paper, padding: '18px 28px',
            letterSpacing: '0.22em', display: 'inline-block',
          }}>Open contact form →</a>
          <a href="contact.html#enquiry-licensing" className="under mono" style={{ color: SITE.ink, paddingTop: 8 }}>
            Licensing & catalogue enquiries →
          </a>
        </div>
      </div>
      <style>{`@media (max-width: 880px) { .cta-grid { grid-template-columns: 1fr !important; } }`}</style>
    </section>
  );
}

function App() {
  return (
    <div data-screen-label="Home">
      <HomeHero />
      <AboutBlock />
      <Works />
      <ContactCTA />
      <SiteFooter />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
