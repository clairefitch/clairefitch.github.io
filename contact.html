<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Contact · Claire Fitch</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="site.jsx"></script>

<script type="text/babel">
// Contact form — submits via Formsubmit.co AJAX endpoint.
// =====================================================================
// FORMSUBMIT SETUP NOTE FOR CLAIRE:
// The first time anyone submits this form, Formsubmit will send a
// confirmation link to fitch.claire@gmail.com. Click it once — after
// that, every submission is delivered straight to your inbox.
//
// For true email obfuscation, Formsubmit can give you a hashed endpoint
// after first activation — log into https://formsubmit.co and copy the
// hashed URL, then replace FORMSUBMIT_URL below with it. Until then the
// raw address sits in the page source but never appears on screen.
// =====================================================================
const FORMSUBMIT_URL = 'https://formsubmit.co/ajax/fitch.claire@gmail.com';

const ENQUIRY_TYPES = [
  { id: 'commission', label: 'Commission',    note: 'New work, bespoke composition or sound design' },
  { id: 'licensing',  label: 'Licensing',     note: 'Catalogue music, sync, festival or broadcast' },
  { id: 'academic',   label: 'Academic',      note: 'Research, supervision, collaboration, writing' },
  { id: 'speaking',   label: 'Speaking',      note: 'Conferences, panels, workshops, training' },
  { id: 'press',      label: 'Press',         note: 'Interviews, biographical material, imagery' },
  { id: 'other',      label: 'Other',         note: 'Something else entirely' },
];

function ContactHero() {
  return (
    <header style={{ background: SITE.dark, color: SITE.darkPaper, position: 'relative' }}>
      <SiteNav mode="overlay" />
      <div className="h-padded" style={{ padding: '160px 56px 110px', maxWidth: 1100 }}>
        <div className="tape tape-light" style={{ marginBottom: 28 }}>Correspondence</div>
        <h1 className="display hero-display" style={{ fontSize: 120, margin: 0, color: SITE.darkPaper }}>
          Get in touch.
        </h1>
        <p style={{ marginTop: 28, fontSize: 22, lineHeight: 1.45, maxWidth: 720, color: 'rgba(246,240,223,0.86)', textWrap: 'pretty' }}>
          For commissions, licensing, academic enquiries, speaking, press or anything else — the form below is the quickest way to a reply. Messages land directly in Claire’s inbox.
        </p>
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 28, marginTop: 32 }}>
          <a href="https://www.linkedin.com/in/fitchclaire/" className="mono under-dark" style={{ color: SITE.darkPaper }}>LinkedIn →</a>
          <a href="https://orcid.org/0000-0002-6686-9345" className="mono under-dark" style={{ color: SITE.darkPaper }}>ORCiD →</a>
          <a href="https://mastodon.ie/@ambiencellist" className="mono under-dark" style={{ color: SITE.darkPaper }}>Mastodon →</a>
        </div>
      </div>
    </header>
  );
}

function ContactForm() {
  const [state, setState] = React.useState({
    name: '', email: '', org: '', type: 'commission', subject: '', message: '', deadline: '',
  });
  // status: 'idle' | 'sending' | 'sent' | 'error'
  const [status, setStatus] = React.useState('idle');
  const [errMsg, setErrMsg] = React.useState('');
  const update = k => e => setState(s => ({ ...s, [k]: e.target.value }));

  async function submit(e) {
    e.preventDefault();
    setStatus('sending');
    setErrMsg('');
    const t = ENQUIRY_TYPES.find(x => x.id === state.type);
    const payload = {
      _subject: `[${t.label}] ${state.subject || 'Website enquiry'}`,
      _template: 'table',
      _captcha: 'false',
      Name: state.name,
      Email: state.email,
      Organisation: state.org || '—',
      'Enquiry type': t.label,
      'Deadline / timeline': state.deadline || '—',
      Message: state.message,
    };
    try {
      const res = await fetch(FORMSUBMIT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok && (data.success === 'true' || data.success === true || res.status === 200)) {
        setStatus('sent');
      } else {
        setStatus('error');
        setErrMsg(data.message || 'Something went wrong. Please try again in a moment.');
      }
    } catch (err) {
      setStatus('error');
      setErrMsg('Network error. Please check your connection and try again.');
    }
  }

  const inputStyle = {
    width: '100%', boxSizing: 'border-box',
    background: SITE.paper, color: SITE.ink,
    border: `1px solid ${SITE.rule}`,
    padding: '14px 16px',
    fontFamily: "'Lora', serif", fontSize: 18,
    outline: 'none', transition: 'border-color .15s',
    borderRadius: 2,
  };
  const labelStyle = { display: 'block', marginBottom: 8 };

  if (status === 'sent') {
    return (
      <section style={{ padding: '120px 56px', borderTop: `1px solid ${SITE.rule}` }}>
        <div className="h-padded" style={{ maxWidth: 720 }}>
          <div className="mono" style={{ color: SITE.accent, marginBottom: 18 }}>Message sent · Thank you</div>
          <h2 className="display display-72" style={{ fontSize: 72, margin: 0, lineHeight: 1, textWrap: 'balance' }}>
            Thank you — your message is on its way.
          </h2>
          <p style={{ marginTop: 26, fontSize: 19, lineHeight: 1.55, color: SITE.muted, textWrap: 'pretty' }}>
            Claire will reply directly to <strong style={{ color: SITE.ink }}>{state.email || 'the address you provided'}</strong>, usually within a week.
            Slower during teaching weeks at DkIT (September–May) and conference travel.
          </p>
          <div style={{ marginTop: 36, display: 'flex', flexWrap: 'wrap', gap: 16 }}>
            <a href="index.html" className="mono" style={{ background: SITE.ink, color: SITE.paper, padding: '16px 26px', letterSpacing: '0.22em' }}>← Back to home</a>
            <button onClick={() => { setStatus('idle'); setState({ name: '', email: '', org: '', type: 'commission', subject: '', message: '', deadline: '' }); }} className="mono under" style={{ background: 'transparent', border: 'none', color: SITE.ink, padding: '16px 0', cursor: 'pointer', letterSpacing: '0.22em' }}>
              Send another message
            </button>
          </div>
        </div>
      </section>
    );
  }

  return (
    <section style={{ padding: '96px 56px', borderTop: `1px solid ${SITE.rule}` }}>
      <div className="contact-grid" style={{ display: 'grid', gridTemplateColumns: '1.4fr 1fr', gap: 64, alignItems: 'start' }}>
        <form onSubmit={submit} style={{ display: 'flex', flexDirection: 'column', gap: 28 }}>
          {/* Honeypot field — bots fill, humans don't see */}
          <input type="text" name="_honey" style={{ display: 'none' }} tabIndex="-1" autoComplete="off" />

          <div id="enquiry">
            <div className="mono" style={{ color: SITE.accent, marginBottom: 18 }}>What is this regarding?</div>
            <div className="enq-grid" style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 1, background: SITE.rule, border: `1px solid ${SITE.rule}` }}>
              {ENQUIRY_TYPES.map(t => {
                const active = state.type === t.id;
                return (
                  <label key={t.id} id={`enquiry-${t.id}`} style={{
                    background: active ? SITE.ink : SITE.paper,
                    color: active ? SITE.paper : SITE.ink,
                    padding: '20px 18px', cursor: 'pointer', display: 'block',
                    transition: 'background .15s, color .15s', position: 'relative',
                  }}>
                    <input type="radio" name="type" value={t.id} checked={active} onChange={update('type')} style={{ position: 'absolute', opacity: 0, pointerEvents: 'none' }} />
                    <div className="mono" style={{ color: active ? 'rgba(246,240,223,0.65)' : SITE.faint, marginBottom: 8 }}>{active ? '◉' : '○'} &nbsp; Enquiry</div>
                    <div className="display" style={{ fontSize: 22, marginBottom: 6 }}>{t.label}</div>
                    <div style={{ fontSize: 14, color: active ? 'rgba(246,240,223,0.75)' : SITE.muted, fontStyle: 'italic', textWrap: 'pretty' }}>{t.note}</div>
                  </label>
                );
              })}
            </div>
          </div>

          <div className="field-row" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 24 }}>
            <div>
              <label className="mono" style={{ ...labelStyle, color: SITE.muted }} htmlFor="name">Your name *</label>
              <input style={inputStyle} id="name" type="text" required value={state.name} onChange={update('name')} placeholder="Jane Doe" />
            </div>
            <div>
              <label className="mono" style={{ ...labelStyle, color: SITE.muted }} htmlFor="org">Organisation</label>
              <input style={inputStyle} id="org" type="text" value={state.org} onChange={update('org')} placeholder="(optional)" />
            </div>
          </div>

          <div className="field-row" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 24 }}>
            <div>
              <label className="mono" style={{ ...labelStyle, color: SITE.muted }} htmlFor="email">Your email *</label>
              <input style={inputStyle} id="email" type="email" required value={state.email} onChange={update('email')} placeholder="you@example.com" />
            </div>
            <div>
              <label className="mono" style={{ ...labelStyle, color: SITE.muted }} htmlFor="deadline">Deadline / timeline</label>
              <input style={inputStyle} id="deadline" type="text" value={state.deadline} onChange={update('deadline')} placeholder="e.g. Q2 2026, by 30 June" />
            </div>
          </div>

          <div>
            <label className="mono" style={{ ...labelStyle, color: SITE.muted }} htmlFor="subject">Subject</label>
            <input style={inputStyle} id="subject" type="text" value={state.subject} onChange={update('subject')} placeholder="A short headline" />
          </div>

          <div>
            <label className="mono" style={{ ...labelStyle, color: SITE.muted }} htmlFor="message">Message *</label>
            <textarea style={{ ...inputStyle, minHeight: 200, resize: 'vertical', fontFamily: "'Lora', serif" }} id="message" required value={state.message} onChange={update('message')} placeholder="Tell me about the project, the audience, the format, the budget if you have one — anything that helps me reply well." />
          </div>

          {status === 'error' && (
            <div style={{ padding: '16px 20px', background: '#fdecea', border: `1px solid oklch(0.7 0.18 30)`, color: 'oklch(0.4 0.15 30)', fontSize: 15 }}>
              {errMsg}
            </div>
          )}

          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 16, marginTop: 8 }}>
            <div className="mono" style={{ color: SITE.faint, maxWidth: 380, textWrap: 'pretty' }}>
              Your message is sent directly to Claire — no third party reads it.
            </div>
            <button type="submit" disabled={status === 'sending'} className="mono" style={{
              background: status === 'sending' ? SITE.muted : SITE.ink,
              color: SITE.paper, border: 'none',
              padding: '16px 28px', cursor: status === 'sending' ? 'wait' : 'pointer',
              letterSpacing: '0.22em', fontSize: 12,
              transition: 'background .15s',
            }} onMouseEnter={e => { if (status !== 'sending') e.currentTarget.style.background = SITE.accent; }}
               onMouseLeave={e => { if (status !== 'sending') e.currentTarget.style.background = SITE.ink; }}>
              {status === 'sending' ? 'Sending…' : 'Send enquiry →'}
            </button>
          </div>
        </form>

        <aside style={{ position: 'sticky', top: 96 }}>
          <div className="mono" style={{ color: SITE.accent, marginBottom: 18 }}>How replies work</div>
          <div className="card" style={{ padding: '32px 28px' }}>
            <div className="mono" style={{ color: SITE.faint, marginBottom: 6 }}>Response time</div>
            <div className="display" style={{ fontSize: 24, fontStyle: 'italic' }}>Usually within a week.</div>
            <div style={{ marginTop: 8, fontSize: 14, color: SITE.muted, textWrap: 'pretty' }}>
              Slower during teaching weeks at DkIT (September–May) and conference travel.
            </div>

            <div style={{ marginTop: 28 }}>
              <div className="mono" style={{ color: SITE.faint, marginBottom: 6 }}>Based</div>
              <div style={{ fontStyle: 'italic' }}>Dublin &amp; Belfast, Ireland</div>
            </div>

            <div style={{ marginTop: 28 }}>
              <div className="mono" style={{ color: SITE.faint, marginBottom: 6 }}>Replying to</div>
              <div style={{ fontStyle: 'italic' }}>Claire will reply directly to the address you provide.</div>
            </div>

            <div style={{ marginTop: 28, borderTop: `1px solid ${SITE.rule}`, paddingTop: 22 }}>
              <div className="mono" style={{ color: SITE.faint, marginBottom: 12 }}>Elsewhere</div>
              <ul style={{ listStyle: 'none', padding: 0, margin: 0, lineHeight: 2 }}>
                {SOCIAL.map(([n, h]) => <li key={n}><a href={h} className="under">{n} →</a></li>)}
              </ul>
            </div>
          </div>
        </aside>
      </div>
      <style>{`
        input:focus, textarea:focus { border-color: ${SITE.accent} !important; }
        button:disabled { opacity: .7; }
        @media (max-width: 880px) {
          .contact-grid { grid-template-columns: 1fr !important; }
          .field-row { grid-template-columns: 1fr !important; }
          .enq-grid { grid-template-columns: 1fr !important; }
        }
      `}</style>
    </section>
  );
}

function FAQ() {
  const faqs = [
    ['What information helps you reply quickly?', 'A clear sense of the project, audience, format, deliverable, and a rough timeline. Budget is helpful for commission and licensing enquiries — even a range.'],
    ['Do you take on commissions?', 'Yes. Claire’s production company has provided audio for clients including Intel, AMD, TG4, Adobe, the Blender Institute, Riverdeep and Forfás. Game, film, advertising, theatre, radio, podcast and television commissions are all welcome.'],
    ['What about licensing existing music?', 'Albums (Ambiencellist, Ambiencellist Part II, Celocity, Another Day) license directly from Magnatune. Royalty-free tracks are available across FilmPac, Pond5, Deposit Photos, MotionElements and others.'],
    ['Are you available for academic supervision or collaboration?', 'Yes — practice-based research at the intersection of music technology, arts practice and human-computer interaction is the core area. Use the Academic enquiry type.'],
    ['Do you offer Sibelius training?', 'Yes — Avid Certified Instructor (ACI) for Sibelius 101 and 110. Workshops, short courses and one-to-one training all possible. Use the Speaking enquiry type.'],
    ['Where does my message go?', 'Straight to Claire’s personal inbox via a delivery service (Formsubmit). No mailing list, no third-party storage, no marketing.'],
  ];
  return (
    <section style={{ padding: '96px 56px', borderTop: `1px solid ${SITE.rule}`, background: SITE.card }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', flexWrap: 'wrap', gap: 12, marginBottom: 32 }}>
        <h2 className="display display-72" style={{ fontSize: 56, margin: 0 }}>A few common questions.</h2>
        <div className="mono" style={{ color: SITE.muted }}>{faqs.length} answered</div>
      </div>
      <div style={{ borderTop: `2px solid ${SITE.ink}` }}>
        {faqs.map(([q, a], i) => (
          <details key={i} style={{ borderBottom: `1px solid ${SITE.rule}`, padding: '22px 0' }}>
            <summary style={{ cursor: 'pointer', listStyle: 'none', display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', gap: 24 }}>
              <span className="display" style={{ fontSize: 24, textWrap: 'pretty' }}>{q}</span>
              <span className="mono" style={{ color: SITE.faint, flex: '0 0 auto' }}>{String(i + 1).padStart(2, '0')} ↓</span>
            </summary>
            <p style={{ marginTop: 14, color: SITE.muted, maxWidth: 800, textWrap: 'pretty' }}>{a}</p>
          </details>
        ))}
      </div>
      <style>{`
        details summary::-webkit-details-marker { display: none; }
        details[open] summary .mono { color: ${SITE.accent} !important; }
      `}</style>
    </section>
  );
}

function App() {
  return (
    <div data-screen-label="Contact">
      <ContactHero />
      <ContactForm />
      <FAQ />
      <SiteFooter />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
